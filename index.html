<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelary - Platform for Complex Systems</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated gradient background */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #000000, #1a1a1a, #000000);
            z-index: -2;
        }

        .gradient-orbs {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            animation: float 20s infinite ease-in-out;
        }

        .orb1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, #ffcc00 0%, transparent 70%);
            top: -300px;
            right: -300px;
        }

        .orb2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff6600 0%, transparent 70%);
            bottom: -200px;
            left: -200px;
            animation-delay: -5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
            75% { transform: translate(30px, 50px) scale(1.05); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Logo section */
        .logo-container {
            margin-bottom: 60px;
            animation: fadeInDown 1s ease-out;
        }

        .logo-image {
            max-width: 300px;
            height: auto;
            margin-bottom: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(255, 204, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .logo-image:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(255, 204, 0, 0.4);
        }

        h1 {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            letter-spacing: -2px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #ffcc00 0%, #ff9500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(255, 204, 0, 0.5);
        }

        .tagline {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: #cccccc;
            margin-bottom: 50px;
            line-height: 1.6;
            font-weight: 300;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        /* Coming soon section */
        .coming-soon {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 50px;
            animation: fadeInUp 1s ease-out 0.6s both;
            transition: all 0.3s ease;
        }

        .coming-soon:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(255, 204, 0, 0.2);
        }

        .coming-soon h2 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: #ffcc00;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .coming-soon p {
            color: #aaaaaa;
            font-size: 1.1rem;
            margin-bottom: 0;
        }

        /* Contact section */
        .contact {
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .contact-label {
            font-size: 0.9rem;
            color: #888888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .email-link {
            color: #ffcc00;
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            position: relative;
        }

        .email-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #ffcc00;
            transition: width 0.3s ease;
        }

        .email-link:hover {
            color: #ff9500;
            transform: translateY(-2px);
        }

        .email-link:hover::after {
            width: 100%;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading animation */
        .loading-dots {
            display: inline-flex;
            margin-left: 10px;
        }

        .loading-dots span {
            width: 8px;
            height: 8px;
            background: #ffcc00;
            border-radius: 50%;
            margin: 0 3px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { 
                transform: scale(0);
                opacity: 0.5;
            }
            40% { 
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }

            .logo-image {
                max-width: 200px;
            }

            .coming-soon {
                padding: 30px 20px;
            }

            h1 {
                letter-spacing: -1px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 15px;
            }

            .logo-image {
                max-width: 150px;
            }

            .coming-soon {
                padding: 25px 15px;
            }

            .email-link {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="gradient-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="545c3c21-f80e-45ac-b365-b68b0120cb83.jpg" alt="Modelary Logo" class="logo-image">
            <h1>MODELARY</h1>
            <p class="tagline">A platform for working with and studying complex systems</p>
        </div>

        <div class="coming-soon">
            <h2>COMING SOON
                <span class="loading-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </h2>
            <p>We're building something extraordinary</p>
        </div>

        <div class="contact">
            <p class="contact-label">Contact us</p>
            <a href="mailto:support@modelary.com" class="email-link">support@modelary.com</a>
        </div>
    </div>
</body>
</html>
