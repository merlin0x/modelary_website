<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelary — Where Your Models Come to Life</title>
    <meta name="description" content="Modelary — a platform for working with and studying complex systems. Coming soon.">
    <meta property="og:title" content="Modelary — Where Your Models Come to Life">
    <meta property="og:description" content="A platform for working with and studying complex systems. Coming soon.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://modelary.com">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23e8e8e8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23e8e8e8'/%3E%3C/svg%3E">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #09090b;
            --fg: #ededf0;
            --muted: #6f6f78;
            --faint: #3a3a42;
            --accent: #9e8cfc;
        }

        html, body { height: 100%; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: Inter, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            min-height: 100dvh;
        }

        /* single, barely-there light source behind the headline */
        .glow {
            position: fixed;
            top: 30%;
            left: 50%;
            width: 640px;
            height: 640px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(158, 140, 252, 0.07) 0%, transparent 62%);
            pointer-events: none;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1.5rem;
        }

        .content {
            animation: enter 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 3rem;
        }

        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            animation: breathe 3s ease-in-out infinite;
        }

        h1 {
            font-size: clamp(2.6rem, 7vw, 4.4rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            line-height: 1.08;
        }

        .tagline {
            margin-top: 1.4rem;
            font-size: clamp(1.05rem, 2.4vw, 1.25rem);
            font-weight: 400;
            color: var(--muted);
            line-height: 1.6;
            max-width: 30rem;
            margin-left: auto;
            margin-right: auto;
        }

        .cta {
            margin-top: 3.5rem;
        }

        .cta a {
            display: inline-block;
            font-size: 0.95rem;
            color: var(--fg);
            text-decoration: none;
            padding: 0.7rem 1.5rem;
            border: 1px solid var(--faint);
            border-radius: 8px;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .cta a:hover {
            border-color: var(--muted);
        }

        footer {
            padding: 1.6rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--faint);
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        @media (prefers-reduced-motion: reduce) {
            .content { animation: none; }
            .status::before { animation: none; }
        }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>

    <main>
        <div class="content">
            <div class="status">Coming soon</div>
            <h1>Where your models<br>come to life</h1>
            <p class="tagline">Modelary is a platform for working with and studying complex systems. We're building something extraordinary.</p>
            <div class="cta">
                <a href="mailto:support@modelary.com">support@modelary.com</a>
            </div>
        </div>
    </main>

    <footer>© <span id="year"></span> Modelary</footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
